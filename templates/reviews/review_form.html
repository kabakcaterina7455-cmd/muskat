{% extends 'base.html' %}

{% block title %}Оставить отзыв о {{ room.name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <h2>Оставить отзыв о номере "{{ room.name }}"</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Отправить отзыв</button>
    </form>
</div>
{% endblock %}
