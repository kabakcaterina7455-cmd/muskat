{% extends 'base.html' %}

{% block title %}Контакты{% endblock %}

{% block content %}
<div class="container py-5">
    <h2>Контакты</h2>
    <div class="row">
        <div class="col-md-6">
            <p><i class="fas fa-map-marker-alt"></i> ул. Морская, 15, п. Береговой</p>
            <p><i class="fas fa-phone"></i> +7 (999) 123-45-67</p>
            <p><i class="fas fa-envelope"></i> info@muscat.ru</p>
            <div id="map" style="height:300px; background:#ddd;">Карта (вставьте код Яндекс.Карт)</div>
        </div>
        <div class="col-md-6">
            <h5>Напишите нам</h5>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="text" name="name" class="form-control" placeholder="Ваше имя" required>
                </div>
                <div class="mb-3">
                    <input type="email" name="email" class="form-control" placeholder="Email" required>
                </div>
                <div class="mb-3">
                    <textarea name="message" class="form-control" rows="4" placeholder="Сообщение" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Отправить</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
