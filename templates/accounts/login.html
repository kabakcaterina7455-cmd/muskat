{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 500px; margin: 60px auto;">
    <h2 style="text-align: center;">Вход в систему</h2>

    {% if form.errors %}
        <p style="color: red; text-align: center;">
            Неверное имя пользователя или пароль.
        </p>
    {% endif %}

    <form method="post" style="margin-top: 30px;">
        {% csrf_token %}

        <div style="margin-bottom: 15px;">
            <label>Имя пользователя:</label>
            {{ form.username }}
        </div>

        <div style="margin-bottom: 15px;">
            <label>Пароль:</label>
            <div style="position: relative;">
                <input type="password"
                       name="password"
                       id="id_password"
                       class="form-control"
                       style="width: 100%; padding-right: 40px;">
                <span onclick="togglePassword()"
                      style="position: absolute; right: 10px; top: 50%;
                             transform: translateY(-50%); cursor: pointer;
                             font-size: 18px; user-select: none;">
                    👁
                </span>
            </div>
        </div>

        <button type="submit"
                style="width: 100%; padding: 12px; background: #8B4513; color: white; border: none; border-radius: 5px;">
            Войти
        </button>
    </form>

    <p style="text-align: center; margin-top: 20px;">
        Нет аккаунта? <a href="{% url 'accounts:register' %}">Зарегистрироваться</a>
    </p>
</div>

<script>
function togglePassword() {
    const field = document.getElementById('id_password');
    const icon = event.target;

    if (field.type === 'password') {
        field.type = 'text';
        icon.textContent = '🙈';
    } else {
        field.type = 'password';
        icon.textContent = '👁';
    }
}
</script>
{% endblock %}
